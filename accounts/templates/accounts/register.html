{% extends "base.html" %}
{% block title %}
    Create Account | QuizForge
{% endblock title %}
{% block content %}
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
        <div class="card shadow-sm border-0 w-100 auth-card">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <h2 class="fw-bold">Create your account</h2>
                    <p class="text-muted">Join QuizForge and start testing your knowledge.</p>
                </div>
                <form method="post">
                    {% csrf_token %}
                    {{ form.non_field_errors }}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100 mt-3">Create Account</button>
                </form>
            </div>
        </div>
    </main>
{% endblock content %}
