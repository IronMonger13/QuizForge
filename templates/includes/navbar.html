<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <!-- Left side: Brand and navigation -->
        <div class="d-flex align-items-center gap-4">
            <a class="navbar-brand fw-bold mb-0"
               href="{% url 'quizzes:dashboard' %}">QuizForge</a>
            <a class="nav-link text-light"
               href="{% url 'quizzes:explore_quizzes' %}">Explore Quizzes</a>
            {% if user.is_authenticated %}
                <a class="nav-link text-light"
                   href="{% url 'quizzes:attempt_history' %}">Attempt History</a>
            {% endif %}
        </div>
        <!-- Right side: Account actions -->
        <div class="d-flex align-items-center gap-3">
            {% if user.is_authenticated %}
                <a href="{% url 'accounts:profile' %}"
                   class="text-light text-decoration-none">
                    <i class="bi bi-person-circle me-1"></i>
                    {{ user.username }}
                </a>
                <form method="post" action="{% url 'accounts:logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'accounts:login' %}"
                   class="btn btn-outline-light btn-sm">Login</a>
                <a href="{% url 'accounts:register' %}" class="btn btn-primary btn-sm">Register</a>
            {% endif %}
        </div>
    </div>
</nav>
